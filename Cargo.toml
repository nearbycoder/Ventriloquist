[package]
name = "ventriloquist"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native macOS test bench for local text-to-speech and voice-to-voice models."

[dependencies]
# Rune is pre-release: pin a rev of `dev` (it is never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
# Sparkle, the updater, is Objective-C.
objc2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true
